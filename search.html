></div></header><main style="min-height:calc(100vh - var(--header-height));padding-top:var(--header-height)"><div class="Search_container__LT3d3"><div class="Search_header__3_Znz"><h1 class="Search_title__F_Uzf">搜索</h1><p class="Search_subtitle__UJ1XG">Search</p><div class="Search_divider__Rh3Eu"></div></div><div class="Search_inputWrapper__joxNZ"><span class="Search_inputIcon__S5pFJ">◆</span><input type="text" class="Search_input__X8JuU" placeholder="搜索文章..." autofocus="" value=""/></div><div class="Search_empty__iG2tj"><p style="font-size:3rem;margin-bottom:var(--space-md)">◇</p><p>输入关键词搜索文章</p></div></div></main><footer class="Footer_footer__JrJN9"><div class="Footer_inner__QTh9n"><span class="Footer_copy__fxI_X">© <!-- -->2026<!-- --> RINのblog. All rights reserved.</span><div class="Footer_links__g0H7R"><a href="https://github.com" target="_blank" rel="noopener noreferrer" class="Footer_link__ZIL7i">GitHub</a></div></div></footer><script src="/my-blog/_next/static/chunks/webpack-924cee60f0604f0b.js" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0]);self.__next_f.push([2,null])</script><script>self.__next_f.push([1,"1:HL[\"/my-blog/_next/static/css/ca166833eeb77d96.css\",\"style\"]\n2:HL[\"/my-blog/_next/static/css/f3888936cbadb3ad.css\",\"style\"]\n"])</script><script>self.__next_f.push([1,"3:I[2846,[],\"\"]\n5:I[5770,[\"972\",\"static/chunks/972-c020e7f518b751dc.js\",\"521\",\"static/chunks/521-52d257cb6e1a8e58.js\",\"797\",\"static/chunks/app/search/page-1a20e992e7460d00.js\"],\"default\"]\nd:I[4707,[],\"\"]\ne:I[6423,[],\"\"]\nf:I[279,[\"972\",\"static/chunks/972-c020e7f518b751dc.js\",\"185\",\"static/chunks/app/layout-78a19bbca5d8b12c.js\"],\"default\"]\n10:I[9295,[\"972\",\"static/chunks/972-c020e7f518b751dc.js\",\"185\",\"static/chunks/app/layout-78a19bbca5d8b12c.js\"],\"default\"]\n11:I[2972,[\"972\",\"static/chunks/972-c020e7f518b751dc.js\",\"931\",\"static/chunks/app/page-56e9eb87701ae4fc.js\"],\"\"]\n13:I[1060,[],\"\"]\n6:T3111,"])</script><script>self.__next_f.push([1,"\n这篇文章只解决一个问题：**以后忘记 AstrBot 怎么启动、怎么进管理面板、怎么查日志时，能快速照着做。**\n\n默认环境是 Windows + WSL2 + Docker Desktop，AstrBot 通过 Docker Compose 运行，项目目录假设为 `~/AstrBot`。\n\n## 1. 命令速查：先把 AstrBot 唤醒\n\n### 1.1 Windows PowerShell：打开 WSL\n\n```powershell\n# 打开默认 WSL 发行版\nwsl\n\n# 如果安装了多个发行版，指定 Ubuntu\nwsl -d Ubuntu\n```\n\n如果 Docker Desktop 没有运行，可以在 PowerShell 中尝试启动：\n\n```powershell\nStart-Process \"$Env:ProgramFiles\\Docker\\Docker\\Docker Desktop.exe\"\n```\n\n也可以直接从 Windows 开始菜单打开 **Docker Desktop**。等待 Docker Desktop 左下角显示引擎正在运行后，再继续下面的命令。\n\n### 1.2 WSL Shell：确认 Docker 并进入 AstrBot 目录\n\n```bash\n# 确认 Docker CLI 可以连接到 Docker Desktop 引擎\ndocker version\ndocker info\n\n# 进入 AstrBot 项目目录\ncd ~/AstrBot\n```\n\n如果你的目录不是 `~/AstrBot`，把最后一行替换成实际路径。`docker info` 能正常输出服务端信息，才说明 WSL 已经连上 Docker 引擎。\n\n### 1.3 WSL Shell：启动 AstrBot\n\n```bash\n# 后台启动 Compose 服务\ndocker compose up -d\n\n# 查看容器状态\ndocker compose ps\n\n# 查看最近 100 行日志\ndocker compose logs --tail=100 astrbot\n\n# 持续跟踪日志，按 Ctrl+C 退出跟踪，不会停止容器\ndocker compose logs -f astrbot\n```\n\n看到类似“管理面板已启动”的日志后，说明 AstrBot 服务已经起来了。\n\n### 1.4 Windows PowerShell：打开 AstrBot WebUI\n\n```powershell\nexplorer.exe http://localhost:6185\n```\n\n也可以直接在浏览器地址栏打开：\u003chttp://localhost:6185\u003e。\n\n进入聊天页面后，输入下面的 AstrBot 内置指令：\n\n```text\n/help\n```\n\n注意：`/help` 是发给 AstrBot 的聊天指令，不是在 WSL 终端中执行的命令。\n\n### 1.5 日常停止、重启、更新和备份\n\n下面这些命令适用于 **Docker Compose 部署**，都在 WSL Shell 的 `~/AstrBot` 目录执行：\n\n```bash\n# 停止服务，但保留容器和 data 数据\ndocker compose stop\n\n# 启动已经停止的服务\ndocker compose start\n\n# 重启服务\ndocker compose restart\n\n# 拉取最新镜像并重新创建服务\ndocker compose pull\ndocker compose up -d\n\n# 备份持久化数据；建议先 stop 再执行\nmkdir -p backups\ntar -czf \"backups/astrbot-data-$(date +%F).tar.gz\" data\n```\n\n如果是用 `docker run` 创建的单容器，而不是 Compose，则使用下面这一组命令：\n\n```bash\ndocker start astrbot\ndocker stop astrbot\ndocker restart astrbot\ndocker logs --tail=100 astrbot\ndocker logs -f astrbot\n```\n\n**不要把两套命令混着当成两种部署方式。** 先用 `docker compose ps` 判断项目是否由 Compose 管理；Compose 服务优先使用 `docker compose ...`，单容器才使用 `docker start/stop/restart ...`。\n\n## 2. 第一次部署：记住 compose.yml 长什么样\n\n如果以后需要重新部署，AstrBot 官方 Docker Compose 示例的核心结构如下：\n\n```yaml\nservices:\n  astrbot:\n    image: soulter/astrbot:latest\n    container_name: astrbot\n    restart: always\n    ports:\n      - \"6185:6185\"\n      - \"6199:6199\"\n    environment:\n      - TZ=Asia/Shanghai\n    volumes:\n      - ./data:/AstrBot/data\n```\n\n在 WSL Shell 中，完整流程可以简化为：\n\n```bash\ngit clone https://github.com/AstrBotDevs/AstrBot.git ~/AstrBot\ncd ~/AstrBot\ndocker compose up -d\ndocker compose ps\n```\n\n这里最重要的是 `./data:/AstrBot/data`。左侧的 `./data` 是 WSL 中 AstrBot 项目目录下的本地数据，右侧是容器内 AstrBot 使用的数据目录。容器删掉或重建后，只要左侧 `data` 还在，配置、插件和会话数据通常就还在。\n\n如果拉取 Docker Hub 镜像很慢，可以把镜像地址替换为官方文档给出的 DaoCloud 镜像地址：\n\n```yaml\nimage: m.daocloud.io/docker.io/soulter/astrbot:latest\n```\n\n## 3. 先理解一次：WSL、Docker Desktop 和 AstrBot 的关系\n\n可以把整套环境记成三层：\n\n| 层 | 作用 | 常用入口 |\n| --- | --- | --- |\n| Windows | 打开 WSL、打开浏览器、运行 Docker Desktop | PowerShell、开始菜单 |\n| WSL2 | 保存项目目录、执行 Linux 命令 | `wsl`、Ubuntu Shell |\n| Docker | 管理 AstrBot 容器和镜像 | `docker compose` |\n\n端口映射也要记住：\n\n- `6185:6185`：AstrBot WebUI，浏览器访问 `http://localhost:6185`。\n- `6199:6199`：常用于 OneBot v11 / NapCat 连接。\n- `./data:/AstrBot/data`：持久化配置、插件和运行数据。\n\n`localhost` 指的是当前访问端口的这台机器。如果 AstrBot 部署在远程服务器，就不能在本地电脑直接访问 `localhost:6185`，需要使用服务器 IP 或域名，并确认服务器防火墙放行对应端口。\n\n## 4. 第一次登录和初始配置\n\n### 登录管理面板\n\n第一次启动时，用户名通常是：\n\n```text\nastrbot\n```\n\n初始密码会打印在启动日志里。可以在 WSL 中搜索日志：\n\n```bash\ndocker compose logs astrbot | grep -Ei \"password|密码|管理面板|dashboard\"\n```\n\n登录 `http://localhost:6185` 后，第一件事是修改密码。不要把密码、API Key 或平台 Token 写进公开仓库。\n\n如果忘记管理面板密码，优先尝试 AstrBot CLI 的密码管理命令；Docker 部署也可以按照官方 FAQ 删除 `data/cmd_config.json` 中 dashboard 配置里的 `password` 键值，然后重新启动并使用新的初始密码。\n\n### 配置模型和消息平台\n\nAstrBot 本身只是运行框架，要真正聊天，还需要至少配置：\n\n1. 一个模型提供商和模型，例如 OpenAI 兼容接口或其他官方支持的提供商。\n2. 一个消息平台，例如 QQ、Telegram、飞书等。\n3. 需要时再安装插件，扩展搜索、工具或平台能力。\n\n这些配置通常在 WebUI 左侧的 **配置**、**平台** 和 **插件** 页面完成。\n\n配置页面修改后要点击 **保存**。如果使用代码编辑配置，流程是：先点击 **应用此配置**，再点击 **保存**；只改文件但不应用，配置不会按预期生效。\n\n## 5. `/help` 和常用聊天指令\n\n这些指令应当发送在 AstrBot 所连接的平台聊天窗口中，而不是 WSL 终端：\n\n| 指令 | 用途 |\n| --- | --- |\n| `/help` | 查看当前可用指令帮助。 |\n| `/sid` | 查看当前会话 ID。 |\n| `/name \u003c别名\u003e` | 为当前会话设置别名。 |\n| `/reset` | 重置当前会话上下文。 |\n| `/stop` | 停止当前正在生成的回复。 |\n| `/new` | 新建会话。 |\n| `/stats` | 查看模型调用、Token 等统计信息。 |\n| `/provider` | 查看或处理当前模型提供商相关信息。 |\n| `/dashboard_update` | 更新 AstrBot 管理面板，通常需要管理员权限。 |\n| `/set` | 设置配置项。 |\n| `/unset` | 删除配置项。 |\n\n有两个容易忘记的细节：\n\n- `/help`、`/set`、`/unset` 默认可能不会完整显示在帮助列表里，但指令仍然可以使用。\n- 如果把唤醒前缀从 `/` 改成了 `!`，就要使用 `!help`、`!reset` 这种形式。\n\n## 6. WebUI 日常操作\n\n管理面板可以记成四个区域：\n\n### 配置\n\n修改模型、系统选项和平台配置。改完一定要保存；代码编辑模式下要先应用再保存。\n\n### 插件\n\n在插件市场查看和安装插件，也可以通过 URL 或文件上传安装。插件来自第三方时要先检查来源和权限，不能把插件市场当成绝对安全的软件仓库。\n\n### 数据\n\n可以查看统计、对话、日志和追踪。排查模型调用问题时，先看 WebUI 日志，再结合容器日志：\n\n```bash\ndocker compose logs --tail=200 astrbot\n```\n\n### 指令管理\n\n可以集中查看已注册的指令，并按插件、权限和状态筛选，还可以启用、禁用或重命名指令。\n\n## 7. 日常维护：更新、备份和进入容器\n\n### 更新 AstrBot\n\n```bash\ncd ~/AstrBot\ndocker compose pull\ndocker compose up -d\ndocker compose ps\ndocker compose logs --tail=100 astrbot\n```\n\n更新前最好先备份 `data`。如果更新后行为异常，可以先看日志，再回滚到上一个镜像版本或恢复备份，不要第一时间删除数据目录。\n\n### 进入容器临时排查\n\n```bash\ndocker compose exec astrbot sh\n```\n\n容器内的临时修改不等于持久化配置。真正需要保留的配置应当写入挂载出来的 `data` 目录，并通过 WebUI 或官方支持的配置方式修改。\n\n### 关闭并重新创建容器\n\n```bash\ndocker compose down\ndocker compose up -d\n```\n\n`down` 会删除容器，但不会删除 `./data` 目录。不要随便使用带有 `-v` 的清理命令，也不要直接删除 `data`，除非已经确认备份可用。\n\n## 8. 常见故障排查\n\n### Docker 命令能找到，但连接不上\n\n现象通常是 `Cannot connect to the Docker daemon`。先回到 Windows，确认 Docker Desktop 已启动并且 WSL Integration 已启用，然后在 WSL 中重新检查：\n\n```bash\ndocker info\n```\n\n### `docker compose` 找不到\n\n确认 Docker Desktop 版本支持 Compose，并重新打开 WSL Shell。不要把 `docker-compose` 和新版 `docker compose` 当成完全相同的命令，优先使用官方当前文档中的 `docker compose`。\n\n### 6185 端口被占用\n\n```bash\n# 查看 6185 是否被 Windows 程序占用\nnetstat -ano | findstr :6185\n\n# 查看容器状态和端口映射\n docker ps --format \"table {{.Names}}\\t{{.Ports}}\\t{{.Status}}\"\n```\n\n如果端口确实被其他程序占用，可以把 compose.yml 左侧端口改成例如 `16185:6185`，然后访问 `http://localhost:16185`。右侧容器端口仍然保持 `6185`。\n\n### WebUI 页面打不开\n\n按顺序排查：\n\n1. `docker compose ps` 是否显示 `astrbot` 正在运行。\n2. `docker compose logs --tail=200 astrbot` 是否有启动异常。\n3. 访问地址是否写成了 `http://localhost:6185`，而不是错误的容器内部地址。\n4. 6185 是否被其他程序占用。\n5. 如果是远程服务器，是否使用了服务器 IP，并放行了端口。\n\n### 容器反复重启\n\n```bash\ndocker compose ps\ndocker compose logs --tail=300 astrbot\n```\n\n重点看镜像启动错误、配置格式错误、端口冲突和平台连接错误。先保留日志，不要反复 `down` 后删除 `data`。\n\n### NapCat 和 AstrBot 都在 Docker 中\n\n两个容器之间通信时，不能把 `127.0.0.1` 当成对方。应该使用 Docker Compose 服务名，例如：\n\n```text\nws://astrbot:6199/ws\n```\n\n具体地址以你的消息平台和 Compose 网络配置为准。\n\n## 9. 这次 Blog 网页预览为什么打不开\n\n这里其实有两个不同的网页，最容易混淆：\n\n- `http://localhost:6185/` 是 **AstrBot WebUI**，由 Docker 中的 AstrBot 提供。\n- `http://localhost:3000/my-blog` 是 **这个 Blog 的本地开发预览**，由 Next.js 开发服务器提供。\n\n当前仓库的 `main` 分支只有一个 README，所以从 `main` 启动 Next.js 自然没有完整 Blog 页面。完整的 Blog 页面和文章结构在 `feat/ui-enhancement` 分支，文章要放在 `content/posts/`，再通过 frontmatter 的 `category: \"学习\"` 归类。\n\n预览 Blog 时要在完整 Blog 分支的项目目录执行：\n\n```powershell\nnpm install\nnpm run dev\n```\n\n然后访问：\n\n```text\nhttp://localhost:3000/my-blog\n```\n\n之所以不是 `http://localhost:3000/`，是因为项目配置了 `basePath: \"/my-blog\"`，用于适配 GitHub Pages 的项目站点路径。\n\n另外，`localhost` 只对当前机器生效。Windows 浏览器、WSL、Docker 容器和 Codex 内置浏览器虽然经常能互通，但它们不是同一个网络环境；如果预览工具打不开，先确认开发服务器是否真的在对应环境中运行，再确认端口、路径和防火墙设置。\n\n## 10. 官方资料\n\n- [AstrBot 官方 GitHub](https://github.com/AstrBotDevs/AstrBot)\n- [Docker 部署文档](https://github.com/AstrBotDevs/AstrBot/blob/master/docs/zh/deploy/astrbot/docker.md)\n- [CLI 指令文档](https://github.com/AstrBotDevs/AstrBot/blob/master/docs/zh/deploy/astrbot/cli.md)\n- [聊天指令文档](https://github.com/AstrBotDevs/AstrBot/blob/master/docs/zh/use/command.md)\n- [WebUI 使用文档](https://github.com/AstrBotDevs/AstrBot/blob/master/docs/zh/use/webui.md)\n- [AstrBot 常见问题](https://github.com/AstrBotDevs/AstrBot/blob/master/docs/zh/faq.md)\n\n这篇备忘录的核心顺序只有一条：**打开 Docker Desktop → 进入 WSL → `cd ~/AstrBot` → `docker compose up -d` → 看日志 → 打开 `6185` → 在聊天窗口输入 `/help`。**\n"])</script><script>self.__next_f.push([1,"7:T1a5d,"])</script><script>self.__next_f.push([1,"\n这是一篇根据一次网络基础学习对话整理的入门笔记。为了方便理解，把网络想象成一座城市：IP 是地址，网关是出口，端口是房间号，DNS 是电话簿。\n\n## 第一次提问：IP、网关、端口与网络安全\n\n### IP 地址：设备在网络中的地址\n\nIP 地址就像网络世界的门牌号。比如 `192.168.10.104`，表示一台设备在局域网中的位置。\n\n常见的内网 IP 包括：\n\n- `192.168.x.x`\n- `10.x.x.x`\n- `172.16.x.x` 到 `172.31.x.x`\n\n内网 IP 主要在家庭、学校或公司内部使用。家里的电脑和手机通常使用内网 IP，路由器再代表它们访问互联网，这个过程叫 NAT（网络地址转换）。\n\n### 子网掩码：判断是不是同一个“小区”\n\n例如：\n\n```text\nIP 地址：192.168.10.104\n子网掩码：255.255.255.0\n```\n\n这通常表示 `192.168.10.xxx` 属于同一个局域网。`192.168.10.104` 和 `192.168.10.105` 往往可以直接通信，而访问其他网络时需要经过路由器。\n\n### 网关：通往外部网络的出口\n\n如果电脑是 `192.168.10.104`，默认网关是 `192.168.10.1`，那么 `192.168.10.1` 通常就是路由器的局域网地址。\n\n```text\n电脑 192.168.10.104\n        │\n        ▼\n路由器 192.168.10.1\n        │\n        ▼\n互联网\n```\n\n同一局域网里的设备像邻居，可以直接找到彼此；要访问互联网，就必须从网关这个“小区大门”出去。\n\n### 端口：找到设备里的具体服务\n\nIP 只能找到一台设备，但一台电脑可以同时运行浏览器、游戏、文件共享和远程桌面，所以还需要端口号。\n\n```text\n192.168.10.104:8080\n```\n\n这里 `192.168.10.104` 是设备地址，`8080` 是服务的“房间号”。常见端口有：\n\n| 端口 | 常见用途 |\n| --- | --- |\n| `80` | HTTP 网页 |\n| `443` | HTTPS 加密网页 |\n| `53` | DNS 查询 |\n| `22` | SSH 远程管理 |\n| `3389` | Windows 远程桌面 |\n\n端口转发相当于把小区的一扇门直接指向家里某个房间，因此不懂用途时不要随便开放端口。\n\n### DNS：把域名翻译成 IP\n\n人容易记住 `www.example.com`，电脑更需要服务器的 IP 地址。DNS 就像互联网的电话簿：\n\n```text\nwww.example.com\n        │\n        ▼\nDNS 查询域名对应的 IP\n        │\n        ▼\n浏览器连接服务器\n```\n\n### 路由器和网络安全\n\n家用路由器通常同时承担 Wi-Fi、DHCP、网关、NAT 和防火墙等工作。DHCP 会自动给设备分配 IP、子网掩码、网关和 DNS。\n\n网络安全可以用“房屋安全”理解：密码是钥匙，防火墙是门卫，HTTPS 是密封的信封，系统更新是在修补门锁漏洞。\n\n最重要的习惯是：使用 WPA2 或 WPA3、设置强密码、为重要账号开启双因素认证、及时更新设备，不随便打开陌生链接，也不要在不清楚用途时开启端口转发。\n\n## 第二次提问：ping 1.1.1.1 在做什么\n\n```powershell\nping 1.1.1.1\n```\n\n这条命令会向公网中的 `1.1.1.1` 发送一个很小的测试请求，等待对方回应，用来检查电脑能否经过路由器到达互联网中的某个公网地址。\n\n`1.1.1.1` 是 Cloudflare 提供的公网地址，也常被用作 DNS 服务地址。但在 `ping` 命令中，它只是一个测试目标，并不是在进行 DNS 查询。\n\n常见返回结果中的：\n\n- `时间=35ms`：一次来回大约需要 35 毫秒，数值越小通常越快；\n- `0% 丢失`：测试数据包全部收到回复；\n- `请求超时`：可能是网络不通，也可能是对方禁止 ICMP ping，不能只凭这一项断定网页一定打不开。\n\n可以先测试本地网关，再测试公网：\n\n```powershell\nping 192.168.10.1\nping 1.1.1.1\n```\n\n第一个主要检查电脑到路由器，第二个主要检查路由器之外的网络。\n\n## 第三次提问：nslookup 与 DNS 地址\n\n```powershell\nnslookup example.com\n```\n\n这个命令是询问 DNS：“`example.com` 对应哪些 IP 地址？”输出中的：\n\n```text\nServer:  192.168.1.1\nAddress: 192.168.1.1\n```\n\n表示本次查询使用的 DNS 服务器是 `192.168.1.1`。它不一定就是默认网关，可能来自路由器、网络软件、VPN 或手动配置。\n\n```text\nName:    example.com\nAddresses: 2606:4700:10::6814:179a\n           2606:4700:10::ac42:93f3\n           172.66.147.243\n           104.20.23.154\n```\n\n这里的 `Addresses` 是域名对应的服务器地址。带冒号、较长的地址是 IPv6；四段数字组成的地址是 IPv4。一个域名有多个地址，可以用于分担访问压力、提高可靠性，并同时支持 IPv4 和 IPv6。\n\n`Non-authoritative answer` 表示 `192.168.1.1` 不是 `example.com` 的官方权威 DNS，只是替你查询或从缓存中返回结果，这通常是正常现象。\n\n`example.com` 是专门保留给教程和文档使用的示例域名，不是专门的 DNS 测试网站，但很适合用来测试 DNS 是否能够解析域名。\n\n## 第四次提问：MAC 地址与 Wi-Fi 配置\n\n### MAC 地址：网卡的硬件身份证\n\nMAC 地址通常长这样：\n\n```text\nAA:BB:CC:11:22:33\n```\n\n它是网卡在局域网中的硬件标识。可以这样区分：\n\n```text\nMAC 地址 = 网卡的身份证\nIP 地址  = 设备当前在网络中的住址\n```\n\n设备换到另一个 Wi-Fi 后，IP 地址通常会改变；MAC 地址通常保持不变，但 Windows 可以使用随机硬件地址来保护隐私。\n\n### 随机硬件地址：给不同 Wi-Fi 使用不同的临时 MAC\n\n开启后，电脑连接不同 Wi-Fi 时，可以使用不同的随机 MAC 地址，减少公共 Wi-Fi 通过 MAC 地址长期识别和追踪同一台设备的可能性。\n\n普通家庭、学校和咖啡店 Wi-Fi 通常建议开启。但如果网络使用 MAC 白名单、固定 IP、设备限速或特殊认证，随机 MAC 变化后可能被当成新设备，需要重新配置。\n\n### IP 分配：自动（DHCP）\n\nWi-Fi 设置中的“IP 分配：自动（DHCP）”表示由路由器自动提供：\n\n```text\nIP 地址\n子网掩码\n默认网关\nDNS 服务器\n```\n\n普通家庭用户建议保持自动。只有搭建服务器、配置打印机、做虚拟机实验或网络明确要求固定地址时，才考虑手动设置 IP。\n\n### DNS 服务器分配：自动（DHCP）\n\n“DNS 服务器分配：自动（DHCP）”表示由路由器告诉电脑使用哪个 DNS。手动填写 DNS 可以用于排查 DNS 故障或使用指定的 DNS 服务，但更换 DNS 不会直接让所有网络速度变快。\n\n最后可以用四句话记住本篇内容：\n\n```text\nIP 地址   = 找到哪一台设备\n端口      = 找到设备里的哪一个服务\n网关      = 通往外部网络的出口\nDNS       = 把域名翻译成 IP\nMAC 地址  = 网卡的硬件身份证\n```\n"])</script><script>self.__next_f.push([1,"8:T3850,"])</script><script>self.__next_f.push([1,"\n## 背景\n\n这次折腾的目标并不是单独安装一个 Ubuntu，而是搭建一套可以长期运行的个人 AI 机器人环境：\n\n- Windows 保留日常使用；\n- Ubuntu 提供 Linux 开发和服务环境；\n- AstrBot 接入微信；\n- Docker 负责部署和运行；\n- Bangumi 插件负责查询番剧、追番和生成信息卡片。\n\n实际过程比预想复杂。最开始讨论的是双系统，后来转向 WSL；WSL 安装完成后又遇到了 GUI、存储位置、Docker 网络、微信好友消息和番剧图片渲染等问题。\n\n这篇文章把整个过程串起来，记录最终得到的方案和踩过的坑。\n\n## 一、双系统还是 WSL：先确定使用目标\n\n一开始的想法是在 Windows 电脑上安装 Ubuntu 双系统。\n\n如果目标是完整的 Ubuntu 桌面体验，双系统仍然是最直接的方案。基本流程是：\n\n1. 备份 Windows 中的重要文件；\n2. 保存 BitLocker 恢复密钥；\n3. 关闭 BitLocker；\n4. 关闭 Windows 快速启动；\n5. 使用磁盘管理压缩 Windows 分区；\n6. 留出未分配空间；\n7. 制作 Ubuntu 启动 U 盘；\n8. 以 UEFI 模式从 U 盘启动；\n9. 选择与 Windows 共存安装。\n\n安装时最危险的选项是：\n\n```text\nErase disk and install Ubuntu\n```\n\n这个选项可能清空整个目标磁盘。第一次安装双系统时，不建议直接使用手动分区，也不要把准备给 Ubuntu 的空间提前格式化成 NTFS。\n\n### WSL 更适合服务和开发\n\n后来实际选择了 WSL。WSL 的优点是：\n\n- 不需要修改磁盘分区；\n- 不需要重启切换系统；\n- 可以直接访问 Windows 文件；\n- 适合运行 Linux 命令、Docker 和后台服务；\n- 与 Windows 开发工具结合方便。\n\n但 WSL 的 GUI 有一个容易误解的地方。\n\nWSLg 主要提供的是“单独运行 Linux 图形应用”的能力，并不是完整的 Ubuntu 桌面。它更接近：\n\n```text\nWindows 桌面\n└── WSLg\n    └── Linux GUI 应用\n```\n\n而不是：\n\n```text\nUbuntu\n└── GNOME/KDE/Xfce 完整桌面\n    ├── 面板\n    ├── 开始菜单\n    ├── 文件管理器\n    └── 系统设置\n```\n\n因此，使用 WSLg 启动 `gnome-text-editor` 时，界面看起来可能不符合传统 Linux 桌面的预期。这不一定是安装错误，而是 WSLg 的设计目标本来就不是提供完整桌面会话。\n\n如果只是开发、运行服务或使用少量 Linux GUI 软件，WSL 很合适。如果想要完整 Ubuntu 桌面，应优先考虑双系统或虚拟机。\n\n## 二、把 WSL Ubuntu 从 C 盘迁移到其他磁盘\n\nWSL 发行版默认会占用系统盘空间。直接去 Windows 的应用目录中剪切 Ubuntu 文件并不安全，推荐使用导出和重新导入的方式。\n\n先查看发行版名称：\n\n```powershell\nwsl -l -v\n```\n\n关闭所有 WSL 实例：\n\n```powershell\nwsl --shutdown\n```\n\n创建目标目录：\n\n```powershell\nNew-Item -ItemType Directory -Force \"D:\\WSL\\Ubuntu\"\n```\n\n把 Ubuntu 导出到 D 盘：\n\n```powershell\nwsl --export Ubuntu \"D:\\WSL\\Ubuntu\\ext4.vhdx\" --format vhd\n```\n\n确认文件已经生成：\n\n```powershell\nGet-Item \"D:\\WSL\\Ubuntu\\ext4.vhdx\"\n```\n\n确认备份无误后，注销旧发行版：\n\n```powershell\nwsl --unregister Ubuntu\n```\n\n最后从新位置导入：\n\n```powershell\nwsl --import-in-place Ubuntu \"D:\\WSL\\Ubuntu\\ext4.vhdx\"\n```\n\n检查结果：\n\n```powershell\nwsl -l -v\nwsl -d Ubuntu\n```\n\n最重要的注意事项是：\n\n\u003e 只有确认导出的 `ext4.vhdx` 存在并且大小正常后，才能执行 `wsl --unregister`。\n\n`--unregister` 会删除当前注册的发行版和原数据。备份文件不存在时，不要继续执行。\n\n## 三、Docker 网络问题：能访问 GitHub，不代表能访问 Docker Hub\n\n在 Ubuntu 中执行：\n\n```bash\nsudo docker run hello-world\n```\n\n如果看到：\n\n```text\nUnable to find image 'hello-world:latest' locally\n```\n\n这句话本身不是错误，意思是本地没有这个镜像，Docker 准备从镜像仓库下载。\n\n真正需要关注的是后续有没有出现：\n\n```text\nHello from Docker!\n```\n\n如果拉取过程中出现：\n\n```text\nConnection timed out\nTLS handshake timeout\nConnection reset by peer\nSSL connection failed\n```\n\n这通常说明 Docker Hub 的连接链路有问题，不一定单纯是“丢包”。可能原因包括：\n\n- Docker Hub 与 GitHub 使用了不同的网络链路；\n- WSL 没有继承 Windows 代理；\n- Docker 守护进程没有配置代理；\n- DNS 解析异常；\n- 防火墙或网络运营商重置连接；\n- Docker 官方软件源连接失败。\n\n可以先测试 Docker Hub：\n\n```bash\ncurl -I --connect-timeout 15 https://registry-1.docker.io/v2/\n```\n\n如果返回 `401 Unauthorized`，反而说明 Registry 已经可以访问。对于 Registry 接口来说，未认证返回 401 是正常现象。\n\n如果只是 Docker 官方 APT 源无法访问，可以暂时使用 Ubuntu 软件源中的 Docker 包：\n\n```bash\nsudo apt update\nsudo apt install -y docker.io docker-compose-v2\n```\n\n网络排查时要记住：\n\n\u003e Windows 能打开网页、WSL 能访问 GitHub，并不代表 Docker 守护进程和容器一定能访问同一个目标地址。\n\n## 四、AstrBot 微信接入：为什么自己能触发，朋友却没有反应\n\nAstrBot 接入个人微信后，消息链路大致是：\n\n```text\n微信好友发送消息\n        ↓\n微信适配器接收事件\n        ↓\nAstrBot 判断是否允许处理\n        ↓\n调用聊天模型\n        ↓\n回复微信消息\n```\n\n如果自己和机器人对话时有日志，但朋友发送消息时完全没有变化，优先检查消息是否进入了 AstrBot，而不是先检查大模型。\n\n常见原因包括：\n\n- 扫码绑定的不是预期微信账号；\n- 微信适配器没有接收到好友私聊事件；\n- 私聊消息需要唤醒前缀；\n- ID 白名单拦截了好友；\n- 当前配置只允许机器人所有者使用；\n- 好友消息事件和自己发送的消息事件类型不同；\n- 微信适配器本身存在平台限制。\n\n排查顺序应该是：\n\n1. 确认扫码绑定的微信账号；\n2. 确认好友发送的是私聊消息；\n3. 查看 AstrBot 是否收到事件日志；\n4. 检查私聊唤醒配置；\n5. 检查 ID 白名单；\n6. 再检查模型调用和回复发送。\n\n如果连“收到消息”的日志都没有，说明问题发生在适配器或平台事件层，不是模型回答质量问题。\n\n## 五、Docker 中查看 AstrBot 状态和日志\n\n如果容器名是 `astrbot`，可以使用：\n\n```bash\ndocker ps -a\n```\n\n启动容器：\n\n```bash\ndocker start astrbot\n```\n\n实时查看最近日志：\n\n```bash\ndocker logs -f --tail=200 astrbot\n```\n\n查看最近 300 行：\n\n```bash\ndocker logs --tail=300 astrbot\n```\n\n进入容器：\n\n```bash\ndocker exec -it astrbot bash\n```\n\n如果容器中没有 Bash：\n\n```bash\ndocker exec -it astrbot sh\n```\n\n进入容器后，也可以查看 AstrBot 文件日志：\n\n```bash\ntail -f /AstrBot/data/logs/astrbot.log\n```\n\n如果不知道容器的真实名称：\n\n```bash\ndocker ps -a --format \"table {{.Names}}\\t{{.Status}}\\t{{.Ports}}\"\n```\n\n实时查看日志时按 `Ctrl+C` 只会退出日志查看，不会停止容器。\n\nAstrBot 管理面板通常可以通过以下地址访问：\n\n```text\nhttp://localhost:6185\n```\n\n如果无法打开，先查看启动日志中实际监听的地址和端口。\n\n## 六、AstrBot 开机自启不是只有一个开关\n\n如果 AstrBot 运行在 WSL 的 Docker 中，开机自启实际上包含两层：\n\n```text\nWindows 启动\n    ↓\nWSL 发行版启动\n    ↓\nDocker 服务启动\n    ↓\nAstrBot 容器启动\n```\n\n只给容器设置重启策略还不够，因为 WSL 发行版本身可能在没有进程运行时退出。\n\n容器层可以设置：\n\n```bash\ndocker update --restart unless-stopped astrbot\n```\n\n这表示 Docker 服务恢复后，容器会自动尝试启动。\n\n但如果希望电脑开机后 AstrBot 真正运行，还需要让 Windows 启动 WSL，或者使用任务计划程序执行类似命令：\n\n```powershell\nwsl -d Ubuntu -- bash -lc \"docker start astrbot\"\n```\n\n如果 Docker 服务还没有启动，就需要先启动 Docker 服务。实际配置时还要考虑：\n\n- `sudo` 是否需要输入密码；\n- WSL 是否启用了 systemd；\n- Docker 服务是否已经准备好；\n- 网络代理是否已经监听；\n- AstrBot 是否需要等待代理和网络恢复。\n\n比较可靠的思路是：\n\n1. Docker 容器设置 `unless-stopped`；\n2. WSL 启动后确保 Docker 服务运行；\n3. AstrBot 连接失败时具有重试能力；\n4. Windows 侧负责唤醒 WSL。\n\n## 七、Bangumi 插件的功能结构\n\n本次使用的插件是 `astrbot_plugin_bangumi`。当前项目文件显示，它是基于 AstrBot 的 Bangumi 查询和追番插件，主要功能包括：\n\n- 搜索番剧、电影和漫画；\n- 查看 Bangumi 条目信息；\n- 查看每日放送表；\n- 订阅番剧更新；\n- 自动推送新集；\n- 生成番剧信息卡片；\n- 生成单集更新卡片；\n- 将较长的文本响应渲染为图片。\n\n插件的主要命令包括：\n\n```text\n/bgm \u003c关键词\u003e\n/bgm番剧 \u003c关键词\u003e\n/bgm电影 \u003c关键词\u003e\n/bgm漫画 \u003c关键词\u003e\n/calendar\n/today\n/追番 \u003c番剧名或ID\u003e\n/弃坑 \u003c番剧名或ID\u003e\n/bgm模板 [1|2|3]\n/放送时间\n```\n\n分类命令必须连续书写，例如：\n\n```text\n/bgm番剧 进击的巨人\n```\n\n不要写成：\n\n```text\n/bgm 番剧 进击的巨人\n```\n\n因为插件注册的是 `bgm番剧` 这个完整命令。\n\n## 八、Bangumi API 和图片渲染配置\n\n插件配置中比较重要的字段如下：\n\n```json\n{\n  \"access_token\": \"Bangumi Token\",\n  \"max_fuzzy_results\": 5,\n  \"proxy_http\": \"\",\n  \"port\": \"\",\n  \"max_retries\": 3,\n  \"render_mode\": \"pillow\",\n  \"episode_card_template\": \"pastel_lightbox\",\n  \"auto_translate_episode_summary\": false,\n  \"auto_translate_subject_summary\": false\n}\n```\n\n### Token 不要重复添加 Bearer\n\n从插件源码看，插件会自动构造请求头：\n\n```python\nself.headers[\"Authorization\"] = f\"Bearer {normalized_token}\"\n```\n\n因此配置中应该填写原始 Token：\n\n```text\nxxxxxxxxxxxxxxxx\n```\n\n不要填写：\n\n```text\nBearer xxxxxxxxxxxxxxxx\n```\n\n否则插件可能构造出重复的认证前缀。\n\n### 三种渲染模式\n\n插件支持三种图片渲染方式：\n\n| 模式 | 特点 |\n|---|---|\n| `pillow` | 本地 Pillow 渲染，依赖少，稳定性最好 |\n| `playwright` | 使用本地浏览器渲染，适合复杂 HTML 样式 |\n| `rpc` | 使用远程 RPC 渲染服务，失败时可回退到 Pillow |\n\n如果目标是先稳定使用，推荐：\n\n```json\n{\n  \"render_mode\": \"pillow\"\n}\n```\n\n插件还支持三种卡片风格：\n\n```text\npastel_lightbox\neditorial_digest\ncinematic_poster\n```\n\n也可以直接在机器人中切换：\n\n```text\n/bgm模板 1\n/bgm模板 2\n/bgm模板 3\n```\n\n模板只改变视觉风格，不会修复 API 网络问题。\n\n## 九、为什么返回的是错误图片，而不是番剧预览图\n\n这次最关键的排查结果是：返回的图片并不是正常的番剧卡片，而是错误文本被渲染成了图片。\n\n插件的处理链路大致如下：\n\n```text\n输入 /bgm番剧 恶女不才\n        ↓\n请求 Bangumi API\n        ↓\nAPI 连接超时\n        ↓\n生成错误文本\n        ↓\n错误文本超过 30 个字符\n        ↓\nResponseRenderer 将文本渲染成图片\n```\n\n源码中的判断逻辑类似：\n\n```python\ndef should_render_text_as_image(text: str) -\u003e bool:\n    return bool(text) and (\"\\n\" in text or len(text) \u003e 30)\n```\n\n因此，类似下面的错误信息：\n\n```text\n❌ 处理失败: Connection timeout ...\n```\n\n也会被转换成图片。\n\n图片上的：\n\n```text\nCINEMATIC RESPONSE\nBangumi Response\nConnection timeout\n```\n\n并不代表番剧卡片生成成功，而是说明请求失败后走了“长文本响应卡片”流程。\n\n正确的排查顺序应该是：\n\n1. 先确认 AstrBot 容器能访问 Bangumi API；\n2. 再检查代理；\n3. 确认 Token 格式；\n4. 重载插件或重启 AstrBot；\n5. 最后再调整图片模板。\n\n如果 AstrBot 在 Docker 中，而代理运行在宿主机上，不要直接写：\n\n```json\n{\n  \"proxy_http\": \"127.0.0.1\",\n  \"port\": \"7890\"\n}\n```\n\n因为容器里的 `127.0.0.1` 指向的是容器自身，不是 Windows 宿主机。\n\n可以尝试：\n\n```json\n{\n  \"proxy_http\": \"host.docker.internal\",\n  \"port\": \"7890\"\n}\n```\n\n或者填写宿主机的局域网 IP：\n\n```json\n{\n  \"proxy_http\": \"192.168.1.100\",\n  \"port\": \"7890\"\n}\n```\n\n前提是代理软件允许局域网连接。\n\n网络恢复后，再测试：\n\n```text\n/bgm番剧 恶女不才\n```\n\n正常结果应该包含：\n\n- 番剧封面；\n- 标题；\n- 评分；\n- 排名；\n- 简介；\n- 集数或播放进度。\n\n## 十、最终排错清单\n\n| 现象 | 优先检查 |\n|---|---|\n| WSL 占用 C 盘 | 使用导出、注销、重新导入 |\n| 想要完整 Linux 桌面 | 使用双系统或虚拟机，不要把 WSLg 当完整桌面 |\n| `hello-world` 找不到本地镜像 | 这是 Docker 正在尝试拉取镜像 |\n| Docker Hub 超时 | 检查 Docker 守护进程、WSL 网络和代理 |\n| AstrBot 自己能对话，朋友不触发 | 检查微信适配器、白名单和唤醒配置 |\n| 容器不知道是否运行 | `docker ps -a` |\n| 查看 AstrBot 日志 | `docker logs -f --tail=200 astrbot` |\n| 修改配置后不生效 | 重载插件或重启 AstrBot |\n| Bangumi 返回错误图片 | 先修复 API 连接，不要先改模板 |\n| Docker 中代理失效 | 使用 `host.docker.internal`，不要直接使用容器内的 `127.0.0.1` |\n\n## 总结\n\n这次最大的经验是：不要把所有问题都归因于应用本身。\n\nWSL 的 GUI 问题，本质上是“完整桌面”和“GUI 应用集成”的概念差异；Docker 的问题，本质上是不同网络层之间的代理和连接路径不同；Bangumi 的问题，则是 API 请求失败后，错误文本被插件继续渲染成了图片。\n\n最终比较稳定的架构是：\n\n```text\nWindows\n└── WSL Ubuntu\n    └── Docker\n        └── AstrBot\n            ├── 微信适配器\n            └── Bangumi 插件\n                ├── Bangumi API\n                └── Pillow 卡片渲染\n```\n\n排查这类系统时，最好始终按照下面的顺序：\n\n```text\n系统环境\n→ 网络连接\n→ Docker 容器\n→ AstrBot 平台适配器\n→ 插件 API\n→ 图片渲染\n```\n\n先确认上一层正常，再继续检查下一层，通常比直接反复修改插件配置更快。\n"])</script><script>self.__next_f.push([1,"9:T1514,"])</script><script>self.__next_f.push([1,"\n## 背景\n\n想在自己的 Telegram 里随时和 AI 对话。于是做了第一步：写一个 Telegram bot，用户发消息，bot 透传给 DeepSeek，把回答发回来。\n\n技术栈：Python + aiogram 3.x，本机 Windows 跑，长轮询模式。\n\n## 设计\n\n核心是一个工厂函数，方便测试注入：\n\n```\nTelegram 用户 → bot.py → handlers.py → deepseek.py → DeepSeek API\n```\n\n- `handlers.py`：白名单校验 → typing 指示 → 调 DeepSeek → 分段回复\n- `deepseek.py`：`chat/completions` 客户端，超时/错误归一化\n- `config.py`：从 `.env` 读配置\n\n数据流：\n\n```json\nPOST https://api.deepseek.com/chat/completions\n{\n  \"model\": \"deepseek-chat\",\n  \"messages\": [{\"role\": \"user\", \"content\": \"你好\"}],\n  \"stream\": false\n}\n```\n\n按 TDD 写，6 个任务、15 个单测全绿。但真正的问题都在\"跑起来\"之后暴露。\n\n## 真 Bug 1：`.env` 没被加载\n\nbot 启动报\"缺少 BOT_TOKEN\"，但 `.env` 里明明写了。测试全过，线上不认。\n\n原因：`config.py` 用 `os.getenv()` 读配置，但**从没调用 `load_dotenv()`**。单测用 `monkeypatch` 直接设环境变量，掩盖了这个坑。\n\n```python\n# 修复前\nimport os\nfrom dataclasses import dataclass, field\n\n# 修复后\nimport os\nfrom dotenv import load_dotenv\nload_dotenv()\n```\n\n**教训**：单测永远测不到\"环境变量从哪来\"这一步。配置加载要单独验证。\n\n## 真 Bug 2：国内网络连不上 Telegram\n\nbot 能启动，但一连接 `api.telegram.org:443` 就超时崩溃。`WinError 121 信号灯超时时间已到`。\n\n根因：直连被墙。Telegram 必须走代理。\n\n我的机器上 Clash 监听 `127.0.0.1:7890`。aiogram 的 `AiohttpSession` 支持 `proxy` 参数：\n\n```python\nfrom aiogram.client.session.aiohttp import AiohttpSession\n\nsession = AiohttpSession(proxy=\"http://127.0.0.1:7890\")\nbot = Bot(token=settings.bot_token, session=session)\n```\n\n代理地址做成配置项，放在 `.env` 里。\n\n**教训**：网络环境差异单测测不出来。先 `curl` 验证连通性，再写连接代码。\n\n## 真 Bug 3：白名单为空的提示自相矛盾\n\n`bot.py` 里，白名单为空时打警告然后 `return`，警告文案却是\"请先给 bot 发一条消息，再从日志读 chat_id\"。但 bot 都不启动，用户怎么发消息？\n\n修复：白名单为空时**不要 return**，让 bot 跑起来（非白名单消息被静默忽略），用户发了消息，我加一行日志读出 chat_id，填进 `.env` 重启。\n\n```python\n# 修复前\nif not settings.allowed_chat_ids:\n    logging.warning(\"...请先给 bot 发一条消息...\")\n    return  # ← bot 不启动，根本收不到消息\n\n# 修复后\nif not settings.allowed_chat_ids:\n    logging.warning(\"...请先给 bot 发一条消息，然后从日志中读取 chat_id...\")\n    # 不 return，让 bot 跑起来\n```\n\n## 开机自启：让 bot 真正\"常驻\"\n\n代码跑通了，但 bot 是我用后台进程临时拉起来的，**依赖我的会话，会话关了 bot 就停**。要像客户端 LLM 一样随时对话，得做成系统级常驻。\n\n### 依赖顺序问题\n\nbot 连 Telegram 必须走 Clash（`127.0.0.1:7890`）。开机时如果 Clash 还没起来，bot 直接崩。两个方案：\n\n1. 让启动脚本等 7890 就绪再启动 bot\n2. 给 bot 加**自动重连**：连不上就每 5 秒重试\n\n我两个都做了。`start-clash.bat` 等端口就绪，`bot.py` 的 `_poll_with_retry` 兜底：\n\n```python\nasync def _poll_with_retry(bot, dp):\n    while True:\n        try:\n            await dp.start_polling(bot)\n            return\n        except TelegramNetworkError as exc:\n            logging.warning(\"连接 Telegram 失败，%s 秒后重试…\", RETRY_DELAY_SECONDS)\n            await asyncio.sleep(RETRY_DELAY_SECONDS)\n```\n\n### 开机自启方式\n\n试了 `schtasks` 计划任务，提示\"拒绝访问\"（需要管理员权限）。改用**启动文件夹**，用户级、免管理员：\n\n`%APPDATA%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\`\n\n放一个快捷方式，指向 `start-all.bat`：\n\n```bat\ncall start-clash.bat    :: 启动 Clash + 等 7890 就绪\ncall start-bot.bat      :: 启动 bot（带 PID 单实例保护）\n```\n\n### 单实例保护\n\n`start-bot.bat` 用 PID 文件防止重复启动：\n\n```bat\nif exist \"%PID_FILE%\" (\n  set /p OLD_PID=\u003c\"%PID_FILE%\"\n  tasklist /FI \"PID eq !OLD_PID!\" | findstr \"!OLD_PID!\" \u003enul\n  if not errorlevel 1 (\n    echo Bot already running\n    exit /b 0\n  )\n)\n```\n\n踩过一个 bat 的坑：**`set /p` 在 `if` 括号块内要用延迟展开 `!OLD_PID!`**，否则 `%OLD_PID%` 在解析整块时还是空的，导致 `FINDSTR: 没有搜索字符串`。\n\n## 总结\n\n| 根因 | 修复 | 教训 |\n| --- | --- | --- |\n| 忘了 `load_dotenv()` | 补上 | 配置加载要单独验证，单测覆盖不到 |\n| 国内网络连不上 Telegram | 代理 + 重连 | 先 curl 验证连通性 |\n| 白名单空时提示自相矛盾 | 不 return，先跑起来 | 提示要可执行 |\n| 会话关闭 bot 就停 | 开机自启 + PID 保护 | 常驻服务要独立于会话 |\n| bat 变量在括号内失效 | 延迟展开 | Windows 批处理的老坑 |\n\nTelegram 接入 LLM 对话这条链路已经跑通：随时对话、开机自启、不依赖任何会话。真正让它稳定可用，靠的是这条链路**跑得稳**——开机自启、自动重连、单实例保护，再加上白名单做安全边界。\n"])</script><script>self.__next_f.push([1,"a:T3c94,"])</script><script>self.__next_f.push([1,"\n这次电赛算是我作为大一新生第一次参加正式比赛，也因为赛制特别，给我留下了许多特别的回忆。在实验室的这四天三夜，非常疲惫，但也让我受益良多。（依旧是新手爱记录，老手已经开始录了）\n\n## 1. 第一天\n\n早上七点半公布，最先要做的是选择题目和商量实现方案，因为是大一，而且主要在学习 ti，虽然这次主控没有特别要求，但我们还是选择用 ti 完成 h 题车载小球平衡控制系统。\n\n赛题文档：[H题 车载平衡滚球运动控制系统（赛题原文 PDF）](/my-blog/files/h-problem-2026.pdf)\n\n![题目截图](/my-blog/images/2026-diansai/timu.png)\n\n### 1.1 方案与水管切割\n\n题目主要分成两部分，循迹小车和摆杆控制系统，车的部分比较传统，我们已经有现成的车和部分循迹代码了，稍微修改一下状态机和 pid 参数即可，题目的关键部分是摆杆控制装置。管道是由四分 PPR 水管的一半组成，不过实验室没有合适的锯子，学长们便带着管子出去找商家切割。第一趟出去吃了个闭门羹，附近的加工店无一例外都说没有这种切法，不过一个大一同学似乎在另外的店通过加钱的方式解决了，所以水管的部分算是到此解决。\n\n### 1.2 摆杆方案选电机\n\n整个摆杆控制系统不止需要管道，还要有一个控制系统。自赛题发布后，我们的讨论重点便是摆杆控制装置的方案。我们组准备的硬件有 35，25kg 扭矩的舵机，还有一个 42 步进电机，考虑到小球需要精细控制，使用舵机做出的显然是投石机而不是平衡仪（笑）。\n\n另附：其实开始有打算购入无刷电机，但是秉持着有现成的绝对不买新的原则，天真的我们否决了这个方案，就最后结果来说当时的想法实在是相当幼稚无知。\n\n### 1.2.1 传动选齿轮齿条\n\n电机选型完成后，还需要有传动装置，初版想法是采用连杆，不过手上没有现成的（赛前准备实在是太不充分了，要什么没什么），于是去淘宝买，看上了一家的 3d 打印摆杆，但是询问后被告知不发顺丰加急，恰逢此时队友找到了网上开源的齿轮齿条的 3d 打印文件，最终决定采用齿轮齿条传动。\n\n3d 件样式：![3d 齿轮齿条](/my-blog/images/2026-diansai/3d-gear-rack.png)\n\n### 1.2.2 调电机改用串口\n\n忙完上面的部分，大概是花了一个上午。实验室寒酸，3d 打印机需要排队，等待打印件这段时间，我先简单搭下电机的电路，另一位控制队友调车，视觉队友在学习新设备。\n\n调试电机的部分真是相当艰难，步进电机在比赛前我并没有实际使用过，赛前训练 25 年 E 题云台打靶时我使用的是双舵机控制水平和竖直方向，所以对于老战友无法上场的情况我是相当惋惜的。对于这个新设备，他又不同于普通的 42 步进电机，具体型号是 ZDT_X42S 第二代闭环步进电机，不过脉冲控制方式好像无法使用了，这部分结论是我调试了一下午才得出的结论。示波器能够观测到脉冲的波形但是电机并不会转，非常的诡异。于是选择采用该电机第二种控制方案——串口指令控制，很难想象串口居然还能做到这种事情，确实是刷新我的认知。参考文档非常长，一大坨的指令和封装函数，努力了三分钟后（可能没有），我选择发给 ai 阅读（ai 真是太好用了有没有懂的）。经过三分钟的 thinking 和 yes 时间，我便得到一份全中文傻瓜版操作指南。\n\n### 1.2.3 供电不足之谜\n\n我觉得我应该是和串口过不去了。五月份校赛比赛时，本来我们进度非常超前，车子早早便能下地了，不过卡在了转弯部分，简单来说原因应该是串口阻塞导致主循环无法切入状态机了（也许）。这一次电机要使用串口时我便隐隐感到不安，后来的事实也确实印证了我的担忧。使用上位机发送指令的时候电机可以正常转动，但是当控制指令通过单片机发送到串口时，电机却始终没有反应。为了搞明白数据卡在了哪里，我用面包板搭了一个简单的串口监听电路：![串口监听调试电路](/my-blog/images/2026-diansai/uart-monitor.jpg)，但是即使电脑收到了单片机发送的数据，数据格式也没有问题，但是电机就是不转，苦思无果后我问了下用过这个电机的学长，原来是因为单片机的 5v 供电不够？（现在编辑文章的时候想象，那电机的脉冲控制估计也是可以的，但是显然当时的我没有想到这一点，如果用脉冲控制也就不会有后面绕的那些大弯了，算是吃了一个很大的教训啊），接上电池后确实就没有问题了，实在是很尴尬，小题大做这一块，浪费了很多时间，电机能正常转动已经是晚上 9 电左右了。\n\n### 1.2.4 3D打印排队\n\n这时候应该提一下 3d 打印机了，第一天负责处理 3d 件的学长比较忙，实验室大一大二一共可能有十来份打印文件了，要确定方案然后根据需要微调一下模型，再等待实验室唯一一台打印机出货，为此学长忙了个通宵都没回去，很不容易。\n\n想到打印机就不得不吐槽一下学校的抠门，这么有用的东西居然只买一台吗你这家伙.......全村都等着你这口饭啊混蛋（恼），后面集体压力了一下老师要去多买几台打印机。\n\n### 1.3 第一夜与门禁\n\n第一夜之前调好了电机，并且打印件也没来，手头没有什么可以干的事，我就跑回去睡觉了。学校的管理制度也有些问题，我们打比赛的人有相当的概率要晚归甚至熬夜，但是对于所有暑假留宿的人员都统一管理 10 点半关门，早上六点开门（这个还是我第二天起了个大早准备去做题才知道的，我五点起床后在一楼各处窗门尝试偷偷翻阅无果，遂放弃开始刷手机等到六点钟开门），后面经我们集体反应给延长到了 12 点半，但是我也只是回去洗了个澡就匆匆回来赶进度了。\n\n## 2. 第二天\n\n### 2.1 打印机罢工\n\n早上一来便遭遇重大事件，仅有的一台打印机在凌晨趁留守学长小睡时间偷偷罢工了，喷嘴被耗材堵住无法正常出丝，耽搁了我们好几组的进度，两个搞 3d 件的学长修了一上午也没能解决，后面我们只好外出找个人商家的 3d 打印机解决打印件问题。\n\n打印机正在创作独特艺术：![打印机艺术](/my-blog/images/2026-diansai/printer-art.jpg)，这个本来应该是电机的支撑架来着（笑）。\n\n### 2.2 等待打印件\n\n由于没有打印件，也就没有支架虽然我前天解决了电机的问题，但是进度也没法由此继续推进，相应的视觉队友也因为整体结构没搭好无法打标签训练模型，这种情况大概持续到了下午，这期间我们主要就是在摸鱼（划掉），主要是在寻找一些开源的资料之类的。在我寻找资料的时候，做控制的队友大概把循迹部分的第二题完成了，虽然不太愿意承认，但是他的循迹部分确实写的很丝滑，当然主要应该算 ai 的功劳吧，其实我们干的活就是 yesyesyes（笑）。\n\n### 2.3 搭建整车结构\n\n拿到打印件的时候已经是晚上了，被这么一个小小的东西拖垮了进度，我们只好火急火燎的开始搭结构，安排核心板摆放位置，摆杆控制装置位置，搭高方案，给车板钻孔，规划摄像头位置，固定各装置位置，完成上述部分大概花了我一个半小时。\n\n附上搭好的摆杆控制系统图片：![摆杆控制系统](/my-blog/images/2026-diansai/ball-pendulum-new.jpg)\n\n### 2.4 深夜调平衡\n\n第二天的晚上我没有回去睡，两个队友完成了各自的部分后回去休息了，我开始研究电机控制摆杆平衡。因为时间有限，视觉的队友草草训练了一个模型后就先回去了，当时的我也是让他们先回去休息（其实是想自己一个人听歌写代码，大晚上一个人听着歌敲敲代码，再喝个咖啡，不知为何我觉得还蛮惬意的？（笑）有一种自由的感觉，尤其是深夜带点雾气的空气，我非常喜欢那个味道）\n\n附一个备赛\"材料\"：![备赛装备](/my-blog/images/2026-diansai/prep-gear.jpg)\n\n实验室的清晨：![实验室清晨](/my-blog/images/2026-diansai/morning-1.jpg)\n\n再说回进度部分，这个晚上主要是把摄像头传出的小球 x 轴偏移数据给解析并转化成电机的差速信号，然后反馈给电机，不过代码结构完善的不太好，因为水管和钢球的摩擦系数非常低，可以预见的是只要电机提供 2-3 度的角度变化，小球就会克服静摩擦，并以极大的加速度向低测滑动，因此电机要有极快的响应速度在小球刚开始克服摩擦加速时就抬高管道从而避免小球有大幅度的位移。理论部分是这样的，但是放在代码实现中便是另一部分了。我第一版的 pid 控制在响应小球的位移上效果不能说是差强人意，大概只能说是完全没有反馈罢。总之，现象便是小球滚到触底后电机都还没开始反转，但是我把 pid 拉到 100 和 0.1 实际现象都没有太大的差别，于是我决定把完善部分交给视觉的队友，因为他的代码写的确实也足够抽象，串口在我观察钢球的 10 秒钟内以不可思议的速度给我电脑发送了惊人长度的数据串，其恐怖程度甚至我删到只剩 1/10 才能勉强在微信中发给他提意见（走之前他提过一嘴现在摄像头发送串口会比较快，我还是太低估他所说的\"快\"是何种离谱程度了）。做完这些夜也深了，我便小睡了一下。\n\n## 3. 第三天\n\n### 3.1 电池短接烧毁\n\n受我所托，早上视觉队友在勤奋的训练模型和打标签，我去给电池充电然后继续寻找开源代码和刷视频。没有什么特别的事情，主要就是在唠嗑，这部分就跳过了。对了，有一组操作不慎，电池的正负短接到一起了，直接烧出烟了，还有刺鼻气味，非常恐怖。然后我们控制队友的主控板子也因为未知情况短接烧穿了，芯片封装都烧融了一部分，还好实验室还有多的主控板，差点就可以回家睡大觉了，我也因此庆幸自己的天猛星至少在比赛结束都完好无损，毕竟我只买了两块，有一块之前误操作锁掉了，这已经是我最后的天猛星了。\n\n### 3.2 移植开源算法\n\n下午移植了网上找到的开源算法，效果确实比我（其实是 ai）搓的要好些，不过应该是 pid 的问题，所以控制没有那么灵敏，但是已经能够提前响应了，此时控制队友的循迹部分也全部完成了，我们组大为振奋，决定熬夜一天把最后的摆杆控制完成。\n\n### 3.3 拉数据与组装\n\n拉了很多次数据，然后让 ai 增加了根据加速度提前驱动电机反转的代码，不过控制效果还是不理想，暂时先暂停一下进度，先把整车组装完成。\n\n小车最终版：![小车最终版](/my-blog/images/2026-diansai/car-final.jpg)\n\n还有一份视觉队友训练模型时候的图片，浑身裹着红色卡纸非常奇特，也在这里附上：![红装出征](/my-blog/images/2026-diansai/red-team.jpg)\n\n### 3.4 通宵调PID\n\n晚上还没有调出合适的值，另一个队友开始加入我一起调 pid，双线开工干活。这个时候大二的学长已经下地调车了，小球控制很稳定，几乎没有特别大的位移，学长不愧是学长，我在一旁看着很是羡慕。不过自身能力有限，为数不多的时间内还不知道能不能把卡了两天的第三题完成，这个时候我内心是很焦急的，渴望做出功绩，渴望拿奖，不甘平庸。\n\n熬了一个通宵。并没有什么进度。算上前一天，这俩天我只睡了大概八个小时，应该是王道热血番看多了，脑子一热想着什么战友啊羁绊啊就熬过去了。（都是成年人了还要这么中二吗，该学会成熟一点了），不过我倒也并不后悔吧，就算现在比赛结束了，让我回到那段时间，我可能还会选择去熬，这对我来说是一段独特的记忆，能够为了什么目标去奋力拼搏，还是很有意思的。\n\n第二个早上：![第二天清晨](/my-blog/images/2026-diansai/morning-2.jpg)\n\n## 4. 第四天\n\n### 4.1 烧录器失灵\n\n连熬两天，精神状态非常不好，在无数次相似的烧录和调试后，突然我的程序烧不进去了，这一下给我整清醒了，我马上断电检查，主控没热电机没事，jlink 的指示灯也在闪烁，不过闪烁效果似乎不太寻常，检查完供电回路后，插上 usb 上电，发现电脑无法识别到 jlink，我当时直接怔住了，因为我手上的天猛星和这个 jlink 都是实验室唯一一块，实验室大概率没有存货，如果我这份坏掉了，我们就连最后一点争取的机会都没有了。但是事已至此，我只好去找别的烧录器。一番翻找后，从学长的桌子里翻到了一个万能烧录器，有 jink 烧录的接法，不过按照接线图插上电脑后也识别不到。两天的疲惫，进度没有突破的挫折，当时的焦急和无奈实在难以用言语来形容。可能是抱着不死心的态度，我提出插到队友的电脑上烧录一下试试，出乎意料，队友能够成功烧录，心中那颗石头算是落地了。然后我自己也试了一下，我也能正常烧录了，至于怎么失灵以及怎么恢复的，我问了好多学长也没得出原因。\n\n### 4.2 转攻第四题\n\n经过分析，我们决定跳过第三题直接调第四题的循迹时小球平衡控制了，相比于第三题，第四题的要求看上去相对轻松一些，事实证明也是如此。经过上午的操作，小车已经可以在形式阶段勉强稳定在中心位置附近 2-3cm 处，但是开车和停车时的惯性还是一大问题，我们最后也没有做出合适的方案。\n\n### 4.3 接受最终结果\n\n下午和上午差不多，都是在无聊的调参，虽然要调的就三四个参数，但是怎么改都改不对，还是蛮挫败的。转眼就到晚上封箱了，经过下午的尝试我们基本也接受了结果，如果测评当天小车没有突然发力的话可能就是成功参赛了，我个人认为拿奖的水平，至少要能够做完第三题也就是能够让小球保持平衡。\n\n## 5. 一些碎碎念\n\n其实电赛没有我大一刚听闻的那么严肃和遥不可及，真的参加过一次便能感觉到其中的乐趣，虽然四天三夜时间很紧张，但是这几天过的还是蛮充实的，短暂的时间内学到了很多东西，也让我们总结了不少教训（笑）。至少明年，希望我能够拿下一个亮眼的成绩吧。\n\n另外，我的摆杆控制代码和视觉的小球追踪代码已经开源在 GitHub，虽然写的很垃圾，没能完赛，不过本着写都写了的原则，还是开源一下吧，说不定能帮到某些人？\n\n代码地址：[github.com/air56/26h-ball-balance-control](https://github.com/air56/26h-ball-balance-control)\n\n（队友的视觉代码是仓库里的 maixcam2，硬件采用的也是 maixcam2）\n"])</script><script>self.__next_f.push([1,"b:T85d,"])</script><script>self.__next_f.push([1,"\n## 背景\n\n每次让 Claude 帮忙写博客，都要在 prompt 里重复\"精简一点\"\"用表格总结\"\"标题加冒号\"。写上一篇 bug 修复 blog 时，第一版偏长，说了\"精简一些\"才缩到满意。\n\n决定把它做成 skill——固化风格，省掉每次重复约束。\n\n## 设计\n\n跟 Claude 聊了三个问题把需求定下来：\n\n- **什么时候触发？** \"写成博客\"\"记录成文章\"\"把修改整理出来\"\n- **输入是什么？** 对话上下文，不需要额外提供素材\n- **输出是什么？** 先展示审阅，确认后写入 `content/posts/`，构建后推 GitHub\n\n写作风格从已有的两篇 blog 提取模板：背景 → 分析 → 修复 → 总结表格。代码片段是核心，段落短，标题用冒号分隔。\n\n## 评测\n\nskill-creator 框架要求跑 with_skill vs without_skill 对照测试。设计了 3 个用例：\n\n| 用例 | 场景 |\n|------|------|\n| CSS bug 修复 | writing-mode + scroll-behavior 两个坑 |\n| 暗色模式实现 | next-themes + hydration 闪烁 |\n| ESLint 配置 | flat config + prettier 版本冲突 |\n\n6 个 agent 并行跑。用 8 个客观指标评分：frontmatter 完整性、日期格式、代码块、章节结构、总结段落、水词检查、标题格式、长度控制。\n\n## 结果\n\n| | With Skill | Without Skill |\n|---|---|---|\n| Pass Rate | **100%** | 87.5% |\n| 超长 | 0 篇 | 2 篇 |\n| 水词 | 0 篇 | 1 篇 |\n| 平均耗时 | 235s | 337s |\n\n带 skill 的三篇全部满分。不带 skill 的暗色模式和 ESLint 两篇都超过 5000 字符，暗色模式那篇还出现了啰嗦的开场白。\n\n时间上快了 30%。有明确结构约束，模型不需要自己琢磨格式和篇幅。\n\n## 总结\n\n做这个 skill 的收益不在于让模型\"写得更漂亮\"——模型还是那个模型。收益在于：\n\n1. **风格稳定**：不会这篇精简下篇啰嗦，每次格式一致\n2. **省掉重复指令**：不用再说\"精简一点\"\"用表格\"\n3. **审阅 + 推送一步走**：确认即发布，不用手动 git 操作\n\n这个 skill 已经内置在当前环境，直接说 **\"把这次的修改写成博客\"** 就会触发。\n"])</script><script>self.__next_f.push([1,"c:T225b,"])</script><script>self.__next_f.push([1,"\n## 痛点\n\nClaude Code 每次要写文件、改代码或执行命令时，弹出一个英文的 `Allow this tool call? [yes/no]`。批还是不批？得仔细看参数才明白它要做什么。我想要的是：每次审批时自动附带一份**结构化的中文变更摘要**。\n\n## 寻找现成方案\n\n搜索了一圈：**ai-report-to-me** 能生成中文日报，但不能用在实时审批场景。Claude Code 的 **Hooks 系统**提供了 `PreToolUse` 事件，理论上可以实现，但没有现成的插件。\n\n## 实现原理\n\nHook 机制本质是事件驱动的脚本执行。在 settings.json 中注册回调，脚本通过 stdin 接收工具调用 JSON，通过 stdout 返回决策：\n\n```json\n{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Write|Edit|Bash\",\n        \"hooks\": [\n          { \"type\": \"command\", \"command\": \"node .claude/hooks/preapproval.cjs\" }\n        ]\n      }\n    ]\n  }\n}\n```\n\n脚本核心逻辑只有三步：解析 JSON → 生成中文摘要 → 输出 `{\"decision\": \"ask\"}`。`ask` 的好处是将摘要展示和审批流程合二为一，不需要额外 UI。\n\n## 踩坑\n\n**配置格式必须精确。** 我最初写的是对象格式，直接被 settings 校验器拒了——`PreToolUse` 必须是数组格式。文档必须写实际验证过的代码，不能靠记忆推测。\n\n## 迭代\n\n初始只覆盖 `Write|Edit|Bash`，用了几次发现文件搜索（Glob）、内容搜索（Grep）、网页抓取（WebFetch）等操作同样需要中文摘要。扩展 matcher 并添加对应的摘要模板即可。\n\n不同操作的摘要各有侧重：\n\n- **Write** → 文件路径、新旧大小对比、diff\n- **Bash** → 命令内容、风险等级（`rm -rf /` 标红，`git push` 标黄）\n- **Glob/Grep** → 搜索范围、关键词\n- **WebFetch** → 目标 URL、查询内容\n\n## 效果\n\n审批从\"开盲盒\"变成了\"看菜单\"。写文件时看到 diff 预览，执行命令时看到风险提示，搜文件时看到搜索范围。清楚、可控。\n\n这个技能已内置在当前环境中，直接对 Claude 说 **\"帮我设置中文审批报告\"** 即可安装。\n\n---\n\n## 迭代：从脚本到技能\n\n最初的版本只是一个 hook 脚本加一段 JSON 配置，能用但粗糙。每次想在新项目用，都得手动复制脚本、手写配置。于是开始把它做成一个可复用的技能。\n\n### 脚本增强\n\n随着使用场景变多，逐步覆盖了更多工具：\n\n- **Write** — 新增 diff 对比：写入前自动生成差异预览，大文件自动截断\n- **Bash** — 新增命令风险评估：`rm -rf /` 标红，`git push` 标黄，`ls` 标绿\n- **Glob / Grep / WebFetch / WebSearch** — 新增搜索类工具的中文摘要，之前审批时只看到工具名\n- **双模式支持** — 兼容 `PreToolUse`（返回 JSON 决策）和 `PermissionRequest`（文本附在弹窗旁）\n\n### 评估闭环\n\n技能光能跑不够，还得验证 AI 能不能正确安装它。写了三个 eval 场景：\n\n1. **安装** — \"帮我安装中文审批报告\"，验证 AI 是否按 SKILL.md 正确执行\n2. **重装** — \"之前的 hook 不工作了，帮我重新设置\"，验证是否能识别已安装状态\n3. **卸载** — \"不需要了，帮我把 hook 卸载掉\"，验证能否干净清理\n\n有技能指导时正确率 ~90%，没有技能裸写时 ~40%。差距主要在配置格式和路径引用——AI 靠记忆写出来的经常跟 Claude Code 实际要求的格式不一致。\n\n### 持续打磨\n\n技能上线后，每次使用都在发现问题：触发描述不够精准、SKILL.md 配置模板有歧义、卸载步骤不够清晰……每次遇到就改一点。刚才又让 Claude 帮忙完善了 SKILL.md 的结构，把安装步骤拆得更细，加了故障排除章节。\n\n从最初一段 JSON 配置，到有脚本、有文档、有评估的完整技能包——工具的成长和代码一样，都是迭代出来的。\n\n---\n\n## 调试：Hook 为什么还是不触发\n\n装好之后用了几天，发现不对劲——明明配置好了，为什么从来没看到过中文摘要？让 Claude 检查了四五轮，每次都回复\"没问题啊，应该能跑\"，但实际就是不生效。\n\n### 线索一：debug 日志\n\n加了一行 debug log 把 stdin 原样写到文件：\n\n```js\nconst LOG = '~/.claude/hooks/preapproval.log';\nfunction debug(...args) {\n  fs.appendFileSync(LOG, new Date().toISOString() + ' ' + args.join(' ') + '\\n');\n}\n```\n\n日志显示 hook **确实在跑**，每次工具调用都有记录。说明 hook 注册和触发机制都没问题，问题出在脚本内部。\n\n### 定位：JSON 字段名不匹配\n\n对比日志中的原始 JSON 和脚本解析逻辑，发现根本原因：\n\nClaude Code 实际传的 JSON 结构是：\n\n```json\n{\n  \"hook_event_name\": \"PreToolUse\",\n  \"tool_name\": \"Bash\",\n  \"tool_input\": { \"command\": \"ls ...\" }\n}\n```\n\n而脚本最初写的解析逻辑是：\n\n```js\nconst toolCall = input.tool_call || {};           // → undefined → {}\nconst tool = (toolCall.tool || input.tool);       // → undefined → 'unknown'\nconst args = (toolCall.arguments || input.arguments); // → undefined → {}\n```\n\n脚本在找 `tool_call.tool`，实际字段是 `tool_name`——两者从来没有对上过。结果所有工具都被识别为 `unknown`，参数永远为空对象，摘要退化成一串无意义的泛用文本。之前几次迭代都意识到了\"可能需要兼容不同格式\"，加了 fallback，但 fallback 优先级排错了——`input.tool` 又不存在，始终落到兜底值。\n\n### 根源二：PreToolUse 的 output 不嵌入审批弹窗\n\n字段名修好后测试，脚本输出完全正确——但真正触发审批时，弹窗依然是纯英文。\n\n原因是 PreToolUse hook 返回的 JSON 中，`output` 字段**不会嵌入 Claude Code 原生的 permission prompt**。它可能被记录到某处，但用户在 yes/no 弹窗里根本看不到。SKILL.md 其实写了：\"PermissionRequest hook 的输出会附加在已有的权限弹窗旁\"——当初安装时配置错了事件类型。\n\n### 走弯路：PostToolUse\n\n发现 PreToolUse 不显示，我第一反应是换成 `PostToolUse`——每次工具执行完都输出摘要。但这完全是方向性错误：PostToolUse 在工具**执行之后**才触发，而审批弹窗在**执行之前**就已经关了。摘要永远追不上弹窗。\n\n### 弯路尽头：PermissionRequest\n\n回头看 SKILL.md，正确的事件是 `PermissionRequest`——它专门用于在权限弹窗旁附加信息。不需要 matcher，不需要返回 JSON 决策，只需要向 stdout 打印文本：\n\n```json\n{\n  \"hooks\": {\n    \"PermissionRequest\": [\n      {\n        \"hooks\": [{ \"type\": \"command\", \"command\": \"node .claude/hooks/preapproval.cjs\" }]\n      }\n    ]\n  }\n}\n```\n\n换上去之后，中文摘要确实出现在弹窗旁边了。但 PermissionRequest 有个限制：它只负责在弹窗旁\"贴一段文本\"，无法通过返回 JSON 来控制审批流程——脚本只能打印，不能做拦截或自动决策。\n\n### 终极方案：PreToolUse + reason 字段\n\n用了一段时间 PermissionRequest，总觉得不够优雅。直到某天重读 Claude Code Hook 文档，发现 PreToolUse 的 JSON 返回值中有一个被我忽略的字段：`reason`。\n\nHook 返回的 JSON 结构是：\n\n```json\n{\n  \"decision\": \"ask\",\n  \"reason\": \"这里写的内容会嵌入到审批弹窗中\"\n}\n```\n\n`reason` 字段的内容**会直接显示在审批弹窗的提示文字里**——这不就是我一开始想要的效果吗？之前只关注了 `output` 字段，完全没注意到 `reason`。\n\n于是最终方案又回到了 PreToolUse，但这次参数对了：\n\n1. **事件**：`PreToolUse`（拦截工具调用，返回决策）\n2. **matcher**：`Write|Edit|Bash|Glob|Grep|Read|WebFetch|WebSearch`\n3. **输出**：JSON `{ decision: \"ask\", reason: summary }`\n\n脚本同时兼容两种模式——检测到事件是 `permissionrequest` 时打印纯文本，否则返回 JSON：\n\n```js\nif (event === 'permissionrequest') {\n  console.log(summary);               // 纯文本附加\n} else {\n  console.log(JSON.stringify({        // JSON 嵌入弹窗\n    decision: 'ask',\n    reason: summary\n  }));\n}\n```\n\n### 教训\n\n三道防线全被绕过：\n\n- **第一道**：JSON 字段名写错了，一开始就没有正确识别工具\n- **第二道**：安装时选错了事件类型（PreToolUse 而非 PermissionRequest）\n- **第三道**：修到 PermissionRequest 就以为到终点了，没继续探索 PreToolUse 的 `reason` 字段\n\n事后看每一步都\"明显\"，但当时没有任何可见反馈——hook 的 stdout 不直接展示给用户，出问题时完全黑盒。能定位全靠那行 debug log。**给以后写 hook 的自己：先加日志，不要相信\"看起来能跑\"。**\n"])</script><script>self.__next_f.push([1,"14:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L3\",null,{\"buildId\":\"w_ul4Tgswyy2R81pn1die\",\"assetPrefix\":\"/my-blog\",\"urlParts\":[\"\",\"search\"],\"initialTree\":[\"\",{\"children\":[\"search\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"search\",{\"children\":[\"__PAGE__\",{},[[\"$L4\",[\"$\",\"$L5\",null,{\"posts\":[{\"slug\":\"astrbot-docker-wsl\",\"title\":\"AstrBot Docker + WSL 使用备忘录\",\"date\":\"2026-08-28\",\"category\":\"学习\",\"tags\":[\"AstrBot\",\"Docker\",\"WSL\",\"备忘录\"],\"description\":\"记录 Windows + WSL2 + Docker Desktop 部署 AstrBot 后的启动、管理、常用指令和故障排查流程。\",\"content\":\"$6\"},{\"slug\":\"computer-network-basics\",\"title\":\"计算机网络入门\",\"date\":\"2026-08-28\",\"category\":\"学习\",\"tags\":[\"计算机网络\",\"网络基础\",\"IP\",\"DNS\",\"路由器\"],\"description\":\"从 IP、网关、端口开始，用生活中的地址、道路和房间理解计算机网络。\",\"content\":\"$7\"},{\"slug\":\"wsl-astrbot-bangumi\",\"title\":\"从双系统到 AstrBot：WSL、Docker 与 Bangumi 番剧机器人的完整排坑记录\",\"date\":\"2026-08-28\",\"category\":\"技术\",\"tags\":[\"WSL\",\"Ubuntu\",\"Docker\",\"AstrBot\",\"Bangumi\"],\"description\":\"记录从 Windows/Ubuntu 双系统规划，到 WSL、Docker、AstrBot 微信接入和 Bangumi 番剧卡片调试的完整过程。\",\"content\":\"$8\"},{\"slug\":\"telegram-bot-remote-control\",\"title\":\"Telegram 接入 LLM 对话\",\"date\":\"2026-08-09\",\"category\":\"技术\",\"tags\":[\"Telegram\",\"DeepSeek\",\"aiogram\",\"Python\"],\"description\":\"把 Telegram bot 接入 DeepSeek AI：TDD 实现、三个真 Bug、代理与开机自启，随时随地对话。\",\"content\":\"$9\"},{\"slug\":\"2026-diansai-review\",\"title\":\"记 26 电赛：四天三夜的车载平衡滚球\",\"date\":\"2026-08-03\",\"category\":\"随笔\",\"tags\":[\"电赛\",\"大学生竞赛\",\"单片机\",\"TI\"],\"description\":\"大一新生的第一次电赛：四天三夜，从选型到调参，小车平衡滚球的极限拉扯。\",\"content\":\"$a\"},{\"slug\":\"blog-writer-skill\",\"title\":\"给 Claude 写了个 Blog 写作 Skill\",\"date\":\"2026-05-24\",\"category\":\"技术\",\"tags\":[\"Claude Code\",\"Skill\",\"Blog\",\"自动化\",\"skill-creator\"],\"description\":\"用 skill-creator 把博客写作流程做成可复用的 skill，基准测试 with_skill 满分 vs without_skill 87.5%。\",\"content\":\"$b\"},{\"slug\":\"claude-code-zh-hook\",\"title\":\"给 Claude Code 装上中文审批摘要 Hook\",\"date\":\"2026-05-24\",\"category\":\"技术\",\"tags\":[\"Claude Code\",\"AI\",\"Hook\",\"Node.js\",\"调试\"],\"description\":\"写一个中文审批摘要 Hook，从字段名写错、事件类型选错到发现 reason 字段——完整的踩坑、迭代与 debug 记录。\",\"content\":\"$c\"},{\"slug\":\"css-bugfix-toc-scroll\",\"title\":\"记一次 Blog 翻车：目录漂移与滚动卡死\",\"date\":\"2026-05-24\",\"category\":\"技术\",\"tags\":[\"CSS\",\"Debug\",\"writing-mode\",\"scroll-behavior\"],\"description\":\"修了两个 CSS Bug：writing-mode 导致目录横向溢出，scroll-behavior: smooth 导致滚轮卡死。\",\"content\":\"\\n## 背景\\n\\n上篇 Claude Code Hook 的文章写完，点进去一看，两个 Bug。\\n\\n## Bug 1：目录漂移到正文里\\n\\n左侧目录栏压在正文上。短文章标题少看不出来，这篇十个标题直接炸了。\\n\\n`PostSidebar` 的 CSS：\\n\\n```css\\n.nav {\\n  display: flex;\\n  flex-direction: column;\\n  writing-mode: vertical-rl;\\n}\\n```\\n\\n`writing-mode: vertical-rl` 把块轴变成了水平方向，`flex-direction: column` 跟着块轴走——导航按钮横向排列，十个按钮加起来 ~200px，sidebar 只有 60px，溢出部分侵入正文。\\n\\n**修复：** `writing-mode` 只加在按钮上，不要加在容器上。\\n\\n```css\\n.nav {\\n  display: flex;\\n  flex-direction: column;\\n  /* writing-mode 删掉 */\\n}\\n.navItem {\\n  writing-mode: vertical-rl; /* 保留 */\\n}\\n```\\n\\n## Bug 2：滚轮滚到一半卡死\\n\\n鼠标滚轮往下滚，页面不动，进度条也不动。点一下鼠标，内容\\\"唰\\\"地跳到应有位置。\\n\\n两个因素叠加：\\n\\n**一、`html { scroll-behavior: smooth }`** 让鼠标滚轮也走 smooth 动画。Chrome 的已知问题：滚轮产生的连续小步长动画排队积压，主线程卡死。\\n\\n**二、Header 的 scroll 事件没节流。** 每次事件都 `scrollHeight`（强制 layout）+ 两次 `setState`（两次 React 重渲染）。\\n\\n**修复：** 删掉全局 `scroll-behavior: smooth`，scroll 事件加 `requestAnimationFrame` 节流。\\n\\n## 总结\\n\\n两个 CSS 属性都是对的，靶点不对就成了 Bug。`writing-mode` 不该加容器上，`scroll-behavior: smooth` 不该全局生效，scroll 事件不该裸奔。\\n\"},{\"slug\":\"ai-assisted-blog\",\"title\":\"AI辅助搭建个人Blog\",\"date\":\"2026-05-23\",\"category\":\"技术\",\"tags\":[\"博客\",\"Next.js\",\"GitHub Pages\",\"踩坑\"],\"description\":\"从设计到部署，记录用AI辅助搭建个人博客遇到的几个坑。\",\"content\":\"\\n## 从零开始\\n\\n参考《明日方舟：终末地》官网的暗色工业风设计，用 **Next.js 14** 搭建了一个个人随笔博客，Markdown 写文章，静态生成后部署到 GitHub Pages。\\n\\n## 一路踩过的坑\\n\\n### 1. 仓库公开才能用 GitHub Pages\\n\\nGitHub Pages 免费版只支持**公开仓库**，私有仓库需要付费。把仓库改为公开后就能用了。\\n\\n### 2. GitHub Actions 分支策略\\n\\n第一次部署报错：\\n```\\nBranch \\\"master\\\" is not allowed to deploy to github-pages\\n```\\n需要在仓库 Settings → Pages 里正确选择 **GitHub Actions** 作为部署源，而不是默认的 \\\"Deploy from a branch\\\"。\\n\\n### 3. 部署后 UI 全崩\\n\\n推送到 GitHub 后网站样式全没了——白色背景加一堆超链接。原因是 GitHub Pages 项目站点的路径是 `/my-blog/`，但 Next.js 默认的资源路径是 `/_next/static/...`，浏览器自然找不到 CSS/JS。\\n\\n修复：在 `next.config.js` 加上 `basePath: '/my-blog'`。\\n\\n### 4. Chrome 能打开，Edge 不行（最诡异的坑）\\n\\nEdge 会把地址栏输入的 `https://air56.github.io/my-blog/` 自动替换成 `http://myblog.rin/`（502 错误）。但如果从**搜索栏**进入却正常。\\n\\n排查后发现：之前曾在 GitHub Pages 设置过自定义域名 `myblog.rin`，虽然删除了配置，但 **Edge 已经缓存了那条 301 永久重定向**，每次输入网址都在本地直接跳转，请求根本没发出去。\\n\\n搜索栏能打开，是因为搜索请求经过了搜索引擎中转，形成了新的导航上下文，绕过了本地 301 缓存。\\n\\nChrome 没事，是因为配置 `myblog.rin` 时 Chrome 根本没访问过那个网站，压根没缓存那条 301。\\n\\n修复：清除 Edge 缓存即可。\\n\\n---\\n\\n从代码配置到部署流程再到浏览器缓存机制，每个坑背后都有值得了解的知识点。记录下来，希望帮到有类似遭遇的人。\\n\"},{\"slug\":\"hello-world\",\"title\":\"你好，世界\",\"date\":\"2026-05-23\",\"category\":\"随笔\",\"tags\":[\"生活\",\"开端\"],\"description\":\"这是博客的第一篇文章，以此作为开端。\",\"content\":\"\\n## 新的开始\\n\\n这是这个博客的第一篇文章。\\n\\n从今天开始，我会在这里记录一些思考与见闻。\\n\\n## 为什么写博客\\n\\n写作是一种思考的方式。把想法写下来，能让它们变得更清晰。\\n\\n### 记录思考\\n\\n很多时候，一个想法在脑海里转瞬即逝。写下来，就能反复审视。\\n\\n### 分享交流\\n\\n如果恰好有人读到，产生一些共鸣或讨论，那就更好了。\\n\\n---\\n\\n\u003e 路虽远，行则将至。\\n\\n就这样开始吧。\\n\"},{\"slug\":\"second-post\",\"title\":\"关于设计的一些思考\",\"date\":\"2026-05-22\",\"category\":\"设计\",\"tags\":[\"设计\",\"美学\",\"思考\"],\"description\":\"好的设计不仅仅是好看，更是一种沟通方式。\",\"content\":\"\\n## 设计与功能\\n\\n好的设计应该是隐形的。它不会喧宾夺主，而是让用户自然地完成任务。\\n\\n### 暗色模式\\n\\n暗色模式不只是把背景变黑。它需要精心设计层次和对比度。\\n\\n### 工业美学\\n\\n《明日方舟：终末地》的工业美学给人留下深刻印象。它的设计语言有几个特点：\\n\\n- **硬朗的几何线条** - 干净利落，不拖泥带水\\n- **高对比度强调色** - 在暗色背景上特别醒目\\n- **质感的处理** - 纹理和细节让界面更有层次\\n\\n```css\\n/* 模拟 Endfield 风格的斜线纹理 */\\n.element {\\n  background-image: repeating-linear-gradient(\\n    -45deg,\\n    transparent,\\n    transparent 2px,\\n    rgba(255, 255, 255, 0.03) 2px,\\n    rgba(255, 255, 255, 0.03) 4px\\n  );\\n}\\n```\\n\\n## 小结\\n\\n设计是一门平衡的艺术。找到功能与美学的平衡点，需要持续地学习和实践。\\n\"}]}],[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/my-blog/_next/static/css/f3888936cbadb3ad.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]]],null],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"search\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Le\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$u
